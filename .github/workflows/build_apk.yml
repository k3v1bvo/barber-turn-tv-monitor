name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Create .env file with secrets
      run: |
        echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://yqzvhtkakmnphoudsadg.supabase.co' }}" > .env
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxenZodGtha21ucGhvdWRzYWRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MTgzNzQsImV4cCI6MjA4NzI5NDM3NH0.Ym5rhF2wv94FqeQPUmFdkPpTqE-Lreaosa5KVwWxh9w' }}" >> .env

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease || ./gradlew assembleDebug

    - name: Find and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BarberSite-TV-APK
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
